<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>结算复核助手 · MVP</title>
<style>
  :root { --ink:#1c2b3a; --sub:#5b6f83; --line:#d8e4f0; --blue:#1a5fa8; --bg:#f6f9fc; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg,#0b2a4a,#1a5fa8); color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:19px; font-weight:600; }
  header p { margin:6px 0 0; font-size:12px; color:#cfe0f2; }
  main { max-width:1180px; margin:18px auto 60px; padding:0 18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input, select, button { font-family:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line); border-radius:7px; }
  button { background:var(--blue); color:#fff; border:0; cursor:pointer; }
  button.ghost { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  .hint { font-size:12px; color:var(--sub); }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th { background:#e9f2fb; text-align:left; padding:6px 8px; border:1px solid #b9cde3; font-weight:600; }
  td { padding:6px 8px; border:1px solid #dbe7f3; vertical-align:top; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; }
  .t-miss { background:#fdeee9; color:#a63a24; }
  .t-dup  { background:#fff4dd; color:#8a5a08; }
  .t-amt  { background:#fdf0dc; color:#8a5a08; }
  .t-unm  { background:#eef1f5; color:#5b6f83; }
  .kpi { display:flex; gap:22px; flex-wrap:wrap; }
  .kpi div { min-width:130px; }
  .kpi b { display:block; font-size:20px; color:#a63a24; }
  .kpi span { font-size:12px; color:var(--sub); }
  pre { background:#f7fafd; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; overflow:auto; }
  .ok { color:#1d7a4f; } .bad { color:#a63a24; }
</style>
</head>
<body>
<header>
  <h1>结算复核助手 · 最小可用原型（P0）</h1>
  <p>输入一票业务 → 费用结构 / 差异清单 / 四级追溯链 ｜ 知识库与知识图谱来自 Harness（不可达时用本地镜像）</p>
</header>

<main>
  <div class="card">
    <div class="row">
      <label class="hint">登录</label>
      <input id="u" value="chenlili" style="width:120px" placeholder="用户名">
      <input id="p" type="password" value="Demo#2026" style="width:130px" placeholder="口令">
      <button onclick="login()">登录</button>
      <span id="loginState" class="hint">未登录</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <select id="keyType">
        <option value="booking_no">订舱号</option>
        <option value="bl_no">提单号</option>
        <option value="order_no">订单号</option>
        <option value="container_no">箱号</option>
      </select>
      <input id="keyValue" value="BK2610-0187" style="width:200px">
      <button onclick="runAll()">复核这一票</button>
      <span class="hint">演示数据：BK2610-0187 / HLCUNB26100457 / SO2610-0187 / MSKU1234567</span>
    </div>
  </div>

  <div id="out"></div>
</main>

<script>
let TOKEN = "";
const $ = (id) => document.getElementById(id);

// 调接口：统一带上 JWT，失败时把后端返回的中文错误直接展示出来
async function api(path) {
  const res = await fetch(path, { headers: { Authorization: "Bearer " + TOKEN } });
  const body = await res.json();
  if (!body.ok) throw new Error(body.error.code + "：" + body.error.msg);
  return body.data;
}

async function login() {
  const res = await fetch("/auth/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("u").value, password: $("p").value })
  });
  const body = await res.json();
  if (!body.ok) { $("loginState").innerHTML = '<span class="bad">登录失败：' + body.error.msg + "</span>"; return; }
  TOKEN = body.data.token;
  $("loginState").innerHTML = '<span class="ok">已登录：' + body.data.role + "，客户范围 " + JSON.stringify(body.data.scope) + "</span>";
}

// 主流程：单票 → 差异 →（对每条差异并发展开追溯）→ 知识库 → 图谱
async function runAll() {
  const out = $("out");
  if (!TOKEN) { out.innerHTML = '<div class="card bad">请先点「登录」</div>'; return; }
  out.innerHTML = '<div class="card hint">查询中…</div>';
  try {
    const kt = $("keyType").value, kv = $("keyValue").value.trim();
    const ship = await api("/api/shipments/" + encodeURIComponent(kv) + "?key_type=" + kt);
    const diff = await api("/api/diff/" + encodeURIComponent(ship.shipment_id));
    const kb   = await api("/api/kb/search?q=" + encodeURIComponent("附加费 费率卡 版本 漏收") + "&top_k=3");
    const why  = await api("/api/graph/why?customer_id=" + encodeURIComponent("C-0731") + "&fee_code=LSS&version=" + diff.rate_card);

    out.innerHTML = renderShip(ship) + renderDiff(diff) + renderActions(ship.shipment_id)
                    + renderKb(kb) + renderGraph(why);
  } catch (e) {
    out.innerHTML = '<div class="card bad">' + e.message + "</div>";
  }
}

function renderShip(s) {
  const rows = s.receivable.map(r =>
    `<tr><td>${r.line_id}</td><td>${r.fee_code}</td><td>${r.amount}</td><td>${r.rate_version}</td><td>${r.source_doc_no}</td><td>${r.remark || ""}</td></tr>`).join("");
  return `<div class="card">
    <div class="row"><b>${s.shipment_id}</b><span class="hint">${s.customer} ｜ 提单 ${s.bl_no} ｜ ${s.bl_date} ｜ ${s.route} ｜ ${s.ctn_type}</span></div>
    <div class="hint" style="margin-top:6px">命中费率卡：<b>${s.rate_card}</b>（按提单签发日取值，制度 §5.2）</div>
    <table><tr><th>行</th><th>费用项</th><th>金额</th><th>计价版本</th><th>来源单据</th><th>备注</th></tr>${rows}</table>
  </div>`;
}

function renderDiff(d) {
  const badge = (k) => `<span class="tag ${k === "缺项" ? "t-miss" : k === "重复" ? "t-dup" : k === "金额不符" ? "t-amt" : "t-unm"}">${k}</span>`;
  const rows = d.differences.map(x =>
    `<tr><td>${badge(x.kind)}</td><td>${x.fee_code} ${x.fee_name}</td><td>${x.amount}</td>
     <td>${x.expected} → ${x.actual}</td><td>${x.reason}</td><td>${x.evidence}</td></tr>`).join("");
  const total = Object.entries(d.totals).map(([c, v]) => `<div><b>${v}</b><span>应收缺口合计（${c}）</span></div>`).join("");
  return `<div class="card">
    <div class="kpi">${total}<div><b>${d.differences.length}</b><span>差异条目</span></div></div>
    <table><tr><th>类型</th><th>费用项</th><th>差额</th><th>应有 → 实有</th><th>原因</th><th>依据</th></tr>${rows}</table>
    <div class="hint" style="margin-top:8px">草稿：需结算专员确认后方可出账；系统不发送任何对外内容。</div>
  </div>`;
}

// 复核与导出：全部是"人点一下"的动作，系统不会自动发送（红线 5）
function renderActions(shipmentId) {
  return `<div class="card">
    <div class="row"><b>复核与导出</b><span class="hint">草稿 → 提交 → 他人审批；导出必须填接收方并留痕</span></div>
    <div class="row" style="margin-top:8px">
      <button onclick="doDraft('${shipmentId}')">① 生成复核草稿</button>
      <button class="ghost" onclick="doSubmit()">② 提交复核</button>
      <button class="ghost" onclick="doApprove('approve')">③ 审批通过（需复核人账号）</button>
      <input id="receiver" placeholder="接收方（导出必填）" style="width:200px">
      <button class="ghost" onclick="doExport('${shipmentId}')">导出追溯包</button>
    </div>
    <div id="actState" class="hint" style="margin-top:8px">尚未生成草稿</div>
  </div>`;
}

let CASE_ID = "";

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error.code + "：" + data.error.msg);
  return data.data;
}

async function doDraft(shipmentId) {
  try {
    const c = await post("/api/review/draft/" + encodeURIComponent(shipmentId));
    CASE_ID = c.case_id;
    $("actState").innerHTML = `已生成草稿 <b>${c.case_id}</b>，冻结缺口 ${JSON.stringify(c.snapshot.totals)}`;
  } catch (e) { $("actState").innerHTML = '<span class="bad">' + e.message + "</span>"; }
}

async function doSubmit() {
  if (!CASE_ID) { $("actState").innerHTML = '<span class="bad">请先生成草稿</span>'; return; }
  try {
    const c = await post("/api/review/submit/" + CASE_ID);
    $("actState").innerHTML = `已提交 <b>${c.case_id}</b>，状态 ${c.status}（审批人须为他人）`;
  } catch (e) { $("actState").innerHTML = '<span class="bad">' + e.message + "</span>"; }
}

async function doApprove(decision) {
  if (!CASE_ID) { $("actState").innerHTML = '<span class="bad">请先生成草稿</span>'; return; }
  try {
    const c = await post("/api/review/approve/" + CASE_ID, { decision, comment: "页面审批" });
    $("actState").innerHTML = `审批完成：<b>${c.status}</b>，审批人 ${c.approved_by}`;
  } catch (e) { $("actState").innerHTML = '<span class="bad">' + e.message + "（提交人不能自审）</span>"; }
}

async function doExport(shipmentId) {
  const receiver = $("receiver").value.trim();
  try {
    const r = await post("/api/export/pack", { shipment_id: shipmentId, receiver });
    $("actState").innerHTML = `已导出，审计号 <b>${r.audit_id}</b>，接收方 ${receiver}；字段白名单 ${r.fields.length} 个`;
  } catch (e) { $("actState").innerHTML = '<span class="bad">' + e.message + "</span>"; }
}

function renderKb(k) {
  const rows = k.hits.map(h =>
    `<tr><td>${h.doc_no} ${h.clause_no}</td><td>${h.title}</td><td>${h.snippet}</td><td>${h.score}</td><td>${h.source}</td></tr>`).join("");
  return `<div class="card"><div class="row"><b>知识库检索</b><span class="hint">后端：${k.provider}（Harness 优先，不可达时本地镜像）</span></div>
    <table><tr><th>出处</th><th>标题</th><th>摘要</th><th>分数</th><th>来源</th></tr>${rows}</table></div>`;
}

function renderGraph(g) {
  const rows = g.path.map(e =>
    `<tr><td>${e.from}</td><td>${e.predicate}</td><td>${e.to}</td><td>${e.source_ref}</td></tr>`).join("");
  return `<div class="card"><div class="row"><b>知识图谱：这条费率为什么适用于这个客户</b><span class="hint">${g.hops} 跳</span></div>
    <table><tr><th>起点</th><th>关系</th><th>终点</th><th>出处</th></tr>${rows}</table></div>`;
}
</script>
</body>
</html>
