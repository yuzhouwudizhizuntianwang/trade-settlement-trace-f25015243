<text x="54" y="52" font-size="26" font-weight="bold" fill="#0b2a4a">海川服贸 · 贸易服务结算与费用追溯 — 现状流程图（AS-IS）</text>
<text x="54" y="80" font-size="12" fill="#5b6f83">依据：6 人角色访谈 285 分钟 · 跟岗 2 小时 · 24 条证据（E-001~E-025）</text>
<text x="54" y="100" font-size="12" fill="#5b6f83">13 步主流程 + 3 条异常路径（X-01~X-03）+ 5 个判断点（P1~P5）　｜　全程人工操作，无任何 AI 介入</text>
